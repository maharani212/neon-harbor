<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #070b1d; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; left: 12px; bottom: 12px; color: #9aa1c7; font: 13px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="err"></div>
<script type="module" src="./src/main.js"></script>
<script>
  window.addEventListener('error', (e) => {
    document.getElementById('err').textContent = 'Error: ' + (e.message || e.type);
  });
</script>
</body>
</html>
